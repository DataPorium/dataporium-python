[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataporium"
dynamic = ["version"]
description = "Python client for the DataPorium Data API: stocks, ETFs, crypto, US economy and housing data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DataPorium LLC", email = "info@dataporium.tech" }]
keywords = ["dataporium", "stock data", "financial data", "market data api", "real estate data", "economic data", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://dataporium.tech"
Documentation = "https://dataporium.tech/api-docs"
Repository = "https://github.com/DataPorium/dataporium-python"
Issues = "https://github.com/DataPorium/dataporium-python/issues"

[tool.setuptools]
packages = ["dataporium"]

[tool.setuptools.dynamic]
version = { attr = "dataporium._version.__version__" }

[tool.setuptools.package-data]
dataporium = ["endpoints.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
